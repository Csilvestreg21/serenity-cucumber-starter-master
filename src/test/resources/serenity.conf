serenity {
    take.screenshots = FOR_FAILURES
    restart.browser.for.each = feature
}

webdriver {
    driver = provided
    provided {
        type = chrome
        chrome = starter.conf.HealeniumDriver
    }
    autodownload = true
}

chrome.capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
        args = ["remote-allow-origins=*","test-type", "no-sandbox", "ignore-certificate-errors", "incognito", "disable-gpu", "disable-dev-shm-usage"]
    }
}